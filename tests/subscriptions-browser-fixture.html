<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Subscriptions fixture · No live YouTube requests</title>
<link rel="stylesheet" href="/__fixture/subscriptions.css">
<style>body{font:16px system-ui;margin:36px;background:#f2f2f2;color:#222}ytd-browse,#primary{display:block}#contents{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}ytd-rich-item-renderer,ytd-grid-video-renderer,ytd-video-renderer,yt-lockup-view-model{display:block;background:white;padding:18px;border-radius:12px}#contents img{width:100%;aspect-ratio:16/9;background:#ddd}#contents a{color:inherit}#contents #video-title{display:block;font-weight:600;margin:12px 0}ytd-channel-name{display:block;color:#666}.fixture-controls{margin:20px 0}</style>
<script src="/__fixture/subscriptions-state.js"></script>
<script>
  const fixtureSaved = JSON.parse(localStorage.getItem('subscriptions-fixture-storage') || 'null') || {
    ytLists: [{ id: 'untouched', name: 'Existing list', channels: [] }],
    ytListsArchived: { abcdefghijk: 123 }, ytListsHideFeedVideos: false,
  };
  const fixtureChanges = [];
  window.fixture = {
    saved: fixtureSaved, failWrites: false, pageKeys: [],
    card(id, title, tag = 'ytd-rich-item-renderer') {
      const card = document.createElement(tag);
      const thumb = document.createElement('a'); thumb.href = '/watch?v=' + id;
      const image = document.createElement('img'); image.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg'; thumb.append(image);
      const link = document.createElement('a'); link.id = 'video-title'; link.href = '/watch?v=' + id; link.textContent = title;
      const channel = document.createElement('ytd-channel-name'); channel.textContent = 'Fixture channel';
      const duration = document.createElement('ytd-thumbnail-overlay-time-status-renderer'); duration.textContent = '12:34';
      card.append(thumb, link, channel, duration); return card;
    },
    add(id, title, tag) { const card = this.card(id, title, tag); document.querySelector('#contents').append(card); return card; },
    focus(enabled) { chrome.storage.local.set({ ytListsHideFeedVideos: enabled }); },
    navigate(path) { history.pushState({}, '', path); window.dispatchEvent(new Event('yt-navigate-finish')); },
  };
  document.addEventListener('keydown', (event) => fixture.pageKeys.push(event.key));
  const fixtureSelect = (values, keys) => Array.isArray(keys)
    ? Object.fromEntries(keys.filter(key => Object.hasOwn(values, key)).map(key => [key, values[key]]))
    : { ...keys, ...values };
  const fixtureArea = (values, persist) => ({
    get(keys, callback) { queueMicrotask(() => callback(fixtureSelect(values, keys))); },
    set(next, callback) {
      queueMicrotask(() => {
        if (persist && fixture.failWrites) {
          chrome.runtime.lastError = { message: 'Fixture storage quota exceeded' };
          callback?.(); chrome.runtime.lastError = null; return;
        }
        const changes = Object.fromEntries(Object.entries(next).map(([key, value]) => [key, { oldValue: values[key], newValue: value }]));
        Object.assign(values, JSON.parse(JSON.stringify(next)));
        if (persist) localStorage.setItem('subscriptions-fixture-storage', JSON.stringify(values));
        callback?.();
        if (persist) fixtureChanges.forEach(listener => listener(changes, 'local'));
      });
    },
  });
  window.chrome = {
    runtime: {
      id: 'fixture', lastError: null, getURL: path => 'chrome-extension://fixture/' + path,
      sendMessage(message, callback) {
        SubscriptionsReviewState.handleMessage(message, { id: 'fixture', tab: { id: 1 }, url: location.href, frameId: 0 }).then(callback, error => callback({ ok: false, error: error.message }));
      },
    },
    storage: { local: fixtureArea(fixtureSaved, true), sync: fixtureArea({}, false), onChanged: { addListener(fn) { fixtureChanges.push(fn); } } },
  };
</script>
<script src="/__fixture/subscriptions-content.js"></script>
<script src="/__fixture/yt-lists-content.js"></script>
</head><body>
<h1>Subscriptions</h1><p>Isolated fixture. All requests are intercepted. No extension installation or live account.</p>
<ytd-browse page-subtype="subscriptions"><div id="primary"><div id="contents"></div></div></ytd-browse>
<script>
  fixture.add('abcdefghijk', 'First native upload · 2 weeks ago');
  fixture.add('lmnopqrstuv', 'Second native upload · 1 hour ago', 'ytd-grid-video-renderer');
  fixture.add('zyxwvutsrqp', 'Third native upload', 'yt-lockup-view-model');
  fixture.add('abcdefghijk', 'Duplicate first upload');
</script>
</body></html>
